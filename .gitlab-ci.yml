stages:
  - lint
  - build
  - test
  - package


variables:
  GIT_SUBMODULE_STRATEGY: recursive
  BUILD_DIR: build-ios
  VARIANT: standard


.macos:
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26


cache:
  key:
    files:
      - CMakeLists.txt
  paths:
    - .ccache/
    - build-ios/


ios-lint:
  extends:
    - .macos

  stage: lint

  script:
    - brew install swiftlint || true
    - swiftlint version

    - |
      cd src/ios
      swiftlint lint --reporter gitlab-codequality || true


ios-build:
  extends:
    - .macos

  stage: build

  script:
    - |
      git submodule update --init --recursive externals/rcheevos/rcheevos || true

      if [ ! -d "externals/rcheevos/rcheevos/include" ]; then
        echo "rcheevos submodule missing, cloning manually..."

        cd externals/rcheevos
        git clone https://github.com/RetroAchievements/rcheevos.git rcheevos
        cd ../..
      fi


    - |
      cmake -S . \
        -B build-ios \
        -G Xcode \
        -DCMAKE_SYSTEM_NAME=iOS \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
        -DCMAKE_OSX_ARCHITECTURES=arm64 \
        -DENABLE_QT=OFF \
        -DENABLE_LIBRETRO=OFF \
        -DENABLE_TESTS=OFF \
        -DENABLE_ROOM_STANDALONE=OFF \
        -DENABLE_RETRO_ACHIEVEMENTS=ON


    - |
      cmake --build build-ios \
        --config Release \
        -j$(sysctl -n hw.ncpu)


  artifacts:
    expire_in: 1 week
    paths:
      - build-ios/**/*.dSYM


ios-test:
  extends:
    - .macos

  stage: test

  needs:
    - ios-build

  script:
    - ctest --test-dir build-ios -VV -C Release



ios-package:
  extends:
    - .macos

  stage: package

  needs:
    - ios-build

  script:

    - |
      APP_PATH=$(find build-ios -name "Azahar.app" -type d | head -1)

      if [ -z "$APP_PATH" ]; then
        echo "Azahar.app not found"
        exit 1
      fi


      BUNDLE_ID="org.azahar_emu.Azahar"


      plutil \
        -replace CFBundleIdentifier \
        -string "$BUNDLE_ID" \
        "$APP_PATH/Info.plist"


      plutil \
        -replace CFBundleExecutable \
        -string "Azahar" \
        "$APP_PATH/Info.plist"


      plutil \
        -replace CFBundleName \
        -string "Azahar" \
        "$APP_PATH/Info.plist"



    - |
      xcrun actool \
        src/ios/AzaharApp/Resources/Assets.xcassets \
        --compile "$APP_PATH" \
        --platform iphoneos \
        --minimum-deployment-target 18.0 \
        --app-icon AppIcon \
        --compress-pngs



    - |
      cp \
      src/ios/AzaharApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png \
      "$APP_PATH/AppIcon60x60@2x.png"


      cp \
      src/ios/AzaharApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png \
      "$APP_PATH/AppIcon60x60@3x.png"



    - |
      if [ -f "src/ios/AzaharApp/Resources/Azahar.entitlements" ]; then
        cp \
        src/ios/AzaharApp/Resources/Azahar.entitlements \
        "$APP_PATH/"
      fi



    - |
      mkdir -p artifacts/Payload

      cp -r \
        "$APP_PATH" \
        artifacts/Payload/


      cd artifacts

      zip -r Azahar.ipa Payload

      cd ..



    - |
      echo "IPA contents:"
      unzip -l artifacts/Azahar.ipa


  artifacts:
    name: ios-$VARIANT-ipa

    paths:
      - artifacts/*.ipa

    expire_in: 1 week
