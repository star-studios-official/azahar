name: ios-build-27

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        variant: ["standard"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Initialize rcheevos submodule
        run: |
          git submodule update --init --recursive externals/rcheevos/rcheevos || true
          if [ ! -d "externals/rcheevos/rcheevos/include" ]; then
            echo "rcheevos submodule not properly initialized, cloning manually..."
            cd externals/rcheevos
            git clone https://github.com/RetroAchievements/rcheevos.git rcheevos
            cd ../..
          fi

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/build-ios
          key: ios-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ios-${{ matrix.variant }}-

      - name: Configure CMake
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_QT=OFF \
            -DENABLE_LIBRETRO=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_ROOM_STANDALONE=OFF \
            -DENABLE_RETRO_ACHIEVEMENTS=ON

      - name: Build
        run: cmake --build build-ios --config Release -j$(sysctl -n hw.ncpu)

      - name: Run tests
        if: matrix.variant == 'standard'
        run: ctest --test-dir build-ios -VV -C Release

      - name: Create unsigned IPA
        run: |
          # Find the .app bundle
          APP_PATH=$(find build-ios -name "Azahar.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Azahar.app not found"
            exit 1
          fi
          
          echo "Found app bundle: $APP_PATH"
          
          # Fix bundle identifier in Info.plist (replace CMake variables with actual values)
          BUNDLE_ID="org.azahar_emu.Azahar"
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$APP_PATH/Info.plist"
          plutil -replace CFBundleExecutable -string "Azahar" "$APP_PATH/Info.plist"
          plutil -replace CFBundleName -string "Azahar" "$APP_PATH/Info.plist"
          
          echo "Updated Info.plist with bundle identifier: $BUNDLE_ID"
          plutil -p "$APP_PATH/Info.plist" | grep -E "(CFBundleIdentifier|CFBundleExecutable|CFBundleName)"
          
          # Compile asset catalog to generate app icons
          echo "Compiling asset catalog..."
          xcrun actool src/ios/AzaharApp/Resources/Assets.xcassets \
            --compile "$APP_PATH" \
            --platform iphoneos \
            --minimum-deployment-target 18.0 \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/partial-info.plist \
            --compress-pngs
          
          # Verify Assets.car was created
          if [ -f "$APP_PATH/Assets.car" ]; then
            echo "Assets.car created successfully"
            ls -lh "$APP_PATH/Assets.car"
          else
            echo "Warning: Assets.car not found"
          fi
          
          # Copy individual icon files directly to app bundle for better compatibility
          # iOS sometimes needs the PNG files directly in the bundle
          echo "Copying icon files to app bundle..."
          cp src/ios/AzaharApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png \
             "$APP_PATH/AppIcon60x60@2x.png"
          cp src/ios/AzaharApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png \
             "$APP_PATH/AppIcon60x60@3x.png"
          
          # Update Info.plist to reference the icon files correctly
          # Merge the partial info plist generated by actool if it exists
          if [ -f "/tmp/partial-info.plist" ]; then
            echo "Merging asset catalog info into Info.plist..."
            # The actool output contains CFBundleIcons which we should merge
            defaults read /tmp/partial-info.plist CFBundleIcons &> /dev/null
            if [ $? -eq 0 ]; then
              echo "CFBundleIcons found in partial plist"
            fi
          fi
          
          # Copy entitlements to IPA root for visibility
          if [ -f "src/ios/AzaharApp/Resources/Azahar.entitlements" ]; then
            cp "src/ios/AzaharApp/Resources/Azahar.entitlements" "$APP_PATH/"
            echo "Copied entitlements to app bundle"
          fi
          
          # Embed entitlements into _CodeSignature/ so sideloading tools
          # (PlumeImpactor, AltStore, etc.) can find and re-sign with them.
          # This mimics what code signing would normally produce.
          if [ -f "src/ios/AzaharApp/Resources/Azahar.entitlements" ]; then
            mkdir -p "$APP_PATH/_CodeSignature"
            plutil -convert binary1 \
              -o "$APP_PATH/_CodeSignature/entitlements.plist" \
              "src/ios/AzaharApp/Resources/Azahar.entitlements"
            echo "Embedded entitlements in _CodeSignature/entitlements.plist"
            # Verify the embedded entitlements
            echo "Embedded entitlements contents:"
            plutil -p "$APP_PATH/_CodeSignature/entitlements.plist"
          fi
          
          # Create IPA directory structure
          mkdir -p artifacts/Payload
          
          # Copy app bundle to Payload
          cp -r "$APP_PATH" artifacts/Payload/
          
          # Verify final bundle structure
          echo "App bundle contents:"
          ls -la "artifacts/Payload/Azahar.app/" | head -30
          
          # Verify Info.plist values
          echo "Final bundle identifier:"
          plutil -extract CFBundleIdentifier raw "artifacts/Payload/Azahar.app/Info.plist"
          
          echo "Checking for icon files:"
          ls -lh "artifacts/Payload/Azahar.app/"AppIcon* || echo "No icon files found"
          
          echo "Checking CFBundleIcons in Info.plist:"
          plutil -extract CFBundleIcons xml1 -o - "artifacts/Payload/Azahar.app/Info.plist" || echo "CFBundleIcons not found"
          
          # Create the IPA (just a zip with .ipa extension)
          cd artifacts
          zip -r Azahar.ipa Payload
          cd ..
          
          # Verify IPA contents
          echo "IPA contents:"
          unzip -l artifacts/Azahar.ipa | grep -E "(Info.plist|Assets.car|AppIcon|Azahar$|entitlements|_CodeSignature)" | head -30
          
          # Verify entitlements are embedded
          echo "Checking for embedded entitlements:"
          unzip -l artifacts/Azahar.ipa | grep -i entitlements || echo "Warning: No entitlements found in IPA"
          
          # Show IPA size
          ls -lh artifacts/Azahar.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.variant }}-ipa
          path: artifacts/*.ipa
          
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.variant }}-dsyms
          path: build-ios/**/*.dSYM
