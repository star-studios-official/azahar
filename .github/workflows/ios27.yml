name: ios-build-27

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        variant: ["standard"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Initialize rcheevos submodule
        run: |
          git submodule update --init --recursive externals/rcheevos/rcheevos || true
          if [ ! -d "externals/rcheevos/rcheevos/include" ]; then
            echo "rcheevos submodule not properly initialized, cloning manually..."
            cd externals/rcheevos
            git clone https://github.com/RetroAchievements/rcheevos.git rcheevos
            cd ../..
          fi

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ${{ github.workspace }}/build-ios
          key: ios-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ios-${{ matrix.variant }}-

      - name: Configure CMake
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DENABLE_QT=OFF \
            -DENABLE_LIBRETRO=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_ROOM_STANDALONE=OFF \
            -DENABLE_RETRO_ACHIEVEMENTS=ON

      - name: Build
        run: cmake --build build-ios --config Release -j$(sysctl -n hw.ncpu)

      - name: Run tests
        if: matrix.variant == 'standard'
        run: ctest --test-dir build-ios -VV -C Release

      - name: Create unsigned IPA
        run: |
          # Find the .app bundle
          APP_PATH=$(find build-ios -name "Azahar.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Azahar.app not found"
            exit 1
          fi
          
          echo "Found app bundle: $APP_PATH"
          
          # Fix bundle identifier in Info.plist (replace CMake variables with actual values)
          BUNDLE_ID="org.azahar_emu.Azahar"
          plutil -replace CFBundleIdentifier -string "$BUNDLE_ID" "$APP_PATH/Info.plist"
          plutil -replace CFBundleExecutable -string "Azahar" "$APP_PATH/Info.plist"
          plutil -replace CFBundleName -string "Azahar" "$APP_PATH/Info.plist"
          
          echo "Updated Info.plist with bundle identifier: $BUNDLE_ID"
          plutil -p "$APP_PATH/Info.plist" | grep -E "(CFBundleIdentifier|CFBundleExecutable|CFBundleName)"
          
          # Compile asset catalog to generate app icons
          echo "Compiling asset catalog..."
          xcrun actool src/ios/AzaharApp/Resources/Assets.xcassets \
            --compile "$APP_PATH" \
            --platform iphoneos \
            --minimum-deployment-target 18.0 \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/partial-info.plist \
            --compress-pngs
          
          # Verify Assets.car was created
          if [ -f "$APP_PATH/Assets.car" ]; then
            echo "Assets.car created successfully"
            ls -lh "$APP_PATH/Assets.car"
          else
            echo "Warning: Assets.car not found"
          fi
          
          # Copy individual icon files directly to app bundle for better compatibility
          # iOS sometimes needs the PNG files directly in the bundle
          echo "Copying icon files to app bundle..."
          cp src/ios/AzaharApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@2x.png \
             "$APP_PATH/AppIcon60x60@2x.png"
          cp src/ios/AzaharApp/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-60@3x.png \
             "$APP_PATH/AppIcon60x60@3x.png"
          
          # Update Info.plist to reference the icon files correctly
          # Merge the partial info plist generated by actool if it exists
          if [ -f "/tmp/partial-info.plist" ]; then
            echo "Merging asset catalog info into Info.plist..."
            # The actool output contains CFBundleIcons which we should merge
            defaults read /tmp/partial-info.plist CFBundleIcons &> /dev/null
            if [ $? -eq 0 ]; then
              echo "CFBundleIcons found in partial plist"
            fi
          fi
          
          # Copy entitlements to IPA root for visibility
          if [ -f "src/ios/AzaharApp/Resources/Azahar.entitlements" ]; then
            cp "src/ios/AzaharApp/Resources/Azahar.entitlements" "$APP_PATH/"
            echo "Copied entitlements to app bundle"
          fi
          
          # Embed entitlements into _CodeSignature/ so sideloading tools
          # (PlumeImpactor, AltStore, etc.) can find and re-sign with them.
          # This mimics what code signing would normally produce.
          if [ -f "src/ios/AzaharApp/Resources/Azahar.entitlements" ]; then
            mkdir -p "$APP_PATH/_CodeSignature"
            plutil -convert binary1 \
              -o "$APP_PATH/_CodeSignature/entitlements.plist" \
              "src/ios/AzaharApp/Resources/Azahar.entitlements"
            echo "Embedded entitlements in _CodeSignature/entitlements.plist"
            # Verify the embedded entitlements
            echo "Embedded entitlements contents:"
            plutil -p "$APP_PATH/_CodeSignature/entitlements.plist"
          fi
          
          # Create IPA directory structure
          mkdir -p artifacts/Payload
          
          # Copy app bundle to Payload
          cp -r "$APP_PATH" artifacts/Payload/
          
          # Embed the entitlements INTO the Mach-O binary itself, exactly like
          # UTM's scripts/package.sh fake_sign(): `ldid -S<entitlements> -I<bundle_id> <binary>`.
          # A loose .entitlements file / _CodeSignature plist is NOT enough: at runtime
          # SecTaskCopyValueForEntitlement reads the code-signature blob inside the binary, and
          # PlumeImpactor/AltStore read macho.entitlements() from the binary when requesting the
          # provisioning profile. Without this, only get-task-allow ever survives. ldid works on
          # macOS and Linux (installed via Homebrew, same as UTM's CI).
          brew install ldid || true
          if ! command -v ldid >/dev/null 2>&1; then
            echo "ERROR: ldid not available (brew install ldid failed)"
            exit 1
          fi
          ldid -S"src/ios/AzaharApp/Resources/Azahar.entitlements" \
               -I"org.azahar_emu.Azahar" \
               "artifacts/Payload/Azahar.app/Azahar"
          echo "=== Entitlements embedded in Mach-O binary: ==="
          ldid -e "artifacts/Payload/Azahar.app/Azahar"
          if ! ldid -e "artifacts/Payload/Azahar.app/Azahar" | grep -q "increased-memory-limit"; then
            echo "ERROR: increased-memory-limit NOT found in binary entitlements"
            exit 1
          fi
          echo "OK: com.apple.developer.kernel.increased-memory-limit is embedded in the binary"
          
          # Verify final bundle structure
          echo "App bundle contents:"
          ls -la "artifacts/Payload/Azahar.app/" | head -30
          
          # Verify Info.plist values
          echo "Final bundle identifier:"
          plutil -extract CFBundleIdentifier raw "artifacts/Payload/Azahar.app/Info.plist"
          
          echo "Checking for icon files:"
          ls -lh "artifacts/Payload/Azahar.app/"AppIcon* || echo "No icon files found"
          
          echo "Checking CFBundleIcons in Info.plist:"
          plutil -extract CFBundleIcons xml1 -o - "artifacts/Payload/Azahar.app/Info.plist" || echo "CFBundleIcons not found"
          
          # Create the IPA (just a zip with .ipa extension)
          cd artifacts
          zip -r Azahar.ipa Payload
          cd ..
          
          # Verify IPA contents
          echo "IPA contents:"
          unzip -l artifacts/Azahar.ipa | grep -E "(Info.plist|Assets.car|AppIcon|Azahar$|entitlements|_CodeSignature)" | head -30
          
          # Verify entitlements are embedded
          echo "Checking for embedded entitlements:"
          unzip -l artifacts/Azahar.ipa | grep -i entitlements || echo "Warning: No entitlements found in IPA"
          
          # Show IPA size
          ls -lh artifacts/Azahar.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.variant }}-ipa
          path: artifacts/*.ipa

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ matrix.variant }}-dsyms
          path: build-ios/**/*.dSYM

  # Manual job: sign the unsigned IPA with your free-account certificate + provisioning
  # profile, embedding the entitlements into the signed binary so the runtime sees
  # increased-memory-limit etc. Requires these repo secrets:
  #   IOS_CERT_P12_BASE64         - base64 of the .p12 exported from PlumeImpactor
  #                                 (Settings -> Export P12; empty password)
  #   IOS_MOBILEPROVISION_BASE64  - base64 of the .mobileprovision for your device
  #                                 (from a previous PlumeImpactor install of Azahar:
  #                                  Payload/Azahar.app/embedded.mobileprovision)
  # Trigger with: Actions -> ios-build-27 -> Run workflow. Free-account certs/profiles
  # expire after ~7 days, so refresh the secrets when the install fails with a
  # provisioning error.
  sign-ipa:
    name: Sign IPA with free certificate
    runs-on: ubuntu-latest
    needs: ios-build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install ldid
        run: brew install ldid

      - name: Download unsigned IPA
        uses: actions/download-artifact@v7
        with:
          # ios-build matrix has a single variant "standard", so the artifact is ios-standard-ipa
          name: ios-standard-ipa
          path: unsigned

      - name: Decode certificate and provisioning profile from secrets
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [ -z "$IOS_CERT_P12_BASE64" ] || [ -z "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "ERROR: set IOS_CERT_P12_BASE64 and IOS_MOBILEPROVISION_BASE64 secrets"
            exit 1
          fi
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > embedded.mobileprovision

      - name: Extract certificate and key from P12
        run: |
          # PlumeImpactor's Export P12 writes an empty password
          openssl pkcs12 -in cert.p12 -nodes -clcerts -passin pass: -out cert.pem
          openssl pkcs12 -in cert.p12 -nodes -nocerts -passin pass: -out key.pem

      - name: Sign IPA with entitlements
        run: |
          mkdir -p Payload
          unzip -q unsigned/Azahar.ipa -d .
          ldid -S"src/ios/AzaharApp/Resources/Azahar.entitlements" \
               -I"org.azahar_emu.Azahar" \
               -K"key.pem" \
               -C"cert.pem" \
               -M"embedded.mobileprovision" \
               "Payload/Azahar.app/Azahar"
          # Also drop the profile in the bundle where installers look for it
          cp embedded.mobileprovision "Payload/Azahar.app/embedded.mobileprovision"
          zip -q -r Azahar-signed.ipa Payload

      - name: Verify entitlements in signed binary
        run: |
          echo "=== Entitlements in signed binary: ==="
          ldid -e "Payload/Azahar.app/Azahar"
          ldid -e "Payload/Azahar.app/Azahar" | grep -q "increased-memory-limit" \
            && echo "OK: increased-memory-limit embedded in signed binary" \
            || { echo "FAIL: increased-memory-limit missing from signed binary"; exit 1; }
          unzip -l Azahar-signed.ipa | grep -q "embedded.mobileprovision" \
            && echo "OK: provisioning profile embedded in IPA" \
            || { echo "FAIL: no embedded.mobileprovision in IPA"; exit 1; }

      - name: Upload signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-signed-ipa
          path: Azahar-signed.ipa
